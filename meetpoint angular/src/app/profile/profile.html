<app-navbar/>
<div class="container-custom">
    <div class="row">
            <div class="card">
                <a href="/home" class="Back-btn">Volver</a>
                <div class="card-body">
                    <h1 class="card-title text-center ">Perfil</h1>
                    <img src="https://picsum.photos/250/250" alt="Profile Picture" class="img-fluid rounded-circle mb-5 mt-4"><br/>
                    <span>Nombre</span>
                    <h1 class="card-title">{{ name }}</h1>
                    <span>Correo</span>
                    <h1 class="card-title">{{ email }}</h1>
                    <span>Biografía</span>
                    <textarea class="card-text" type="text" id="bio" name="bio" [(ngModel)]="bio" placeholder='{{ bio }}' (ngModelChange)="updateBio()"></textarea>
                </div>
        </div>
    </div>
</div>
