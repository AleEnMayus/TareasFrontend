<app-navbar></app-navbar>
<div class="home-container">
    <div class="welcome-message">
        <h1>Bienvenido a MeetPoint</h1>
        <p>MeetPoint es una plataforma para encontrar personas con las mismas aficiones que tú.</p>
        <h3>Baja para ver más!</h3>
    </div>

    <div class="posts-container container d-flex justify-content-center align-items-center flex-column">
        <div *ngFor="let post of posts" class="post-card">
                <h3>{{ post.title }}</h3>
                <p>{{ post.summary }}</p>
                <button (click)="viewDetails(post.id)" class="w-50">Ver detalles</button>
        </div>
    </div>
</div>
<footer>MeetPoint - Todos los derechos reservados</footer>
