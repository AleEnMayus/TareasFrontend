<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Tracker</title>
  <link rel="stylesheet" href="RESOUCER/CSS/index.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <header class="navbar">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link active" href="#">Inicio</a>
            <a class="nav-link" href="#">Servicios</a>
            <a class="nav-link" href="#">Pedidos</a>
            <a class="nav-link" href="#">Facturar</a>
          </div>
        </div>
      </div>
    </nav>
    <div class="logo">
      <img src="RESOUCER/IMG/Recurso-2.png" alt="Food Tracker" />
    </div>
  </header>

  <main class="main-container">
    <aside class="sidebar">
      <div class="title">
        <h2>REGISTRO DE COMIDAS</h2>
      </div>
      <div>
        <form id="foodForm">
          <input type="text" id="foodName" placeholder="Nombre de la comida" required />
          <input type="text" id="foodType" placeholder="Tipo (ej. desayuno)" required />
          <input type="number" id="calories" placeholder="Calorías" required />
          <button type="submit">Agregar comida</button>
        </form>
      </div>
    </aside>

    <section class="content">
      <h1>Food Tracker</h1>
      <p class="tagline">la mejor experiencia</p>
      <div id="foodList"></div>
    </section>
  </main>

  <script src="../CONTROLLERS/RegCom.js"></script>
</body>
</html>
