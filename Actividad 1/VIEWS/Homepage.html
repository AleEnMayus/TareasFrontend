<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <link rel="stylesheet" href="RESOUCER/CSS/Homepage.css">

<body>
  <div class="header">
    <div>
        <div class="d-flex flex-column">
            <h1 id="welcome" class="flex-start">¡Hola, usuario!</h1>
            <p id="balance">Balance: $0</p>

        <img src="resoucer/img/cliente.png" alt="Foto de usuario" class="user-photo" />
    </div>
    <h1>¡Bienvenido a PayCad!</h1>
  </div>

  <ul class="services">
    <li>
      <img src="resoucer/img/betplay.png" alt="Servicio 1" />
      <div class="info">
        <h2>Betplay</h2>
      </div>
      <span class="price">$10000,00</span>

    <li>
      <img src="resoucer/img/falabella.png" alt="Servicio 2" />

        <h2>Falabella</h2>
      </div>
      <span class="price">$18000,00</span>
    </li>
    <li>
      <img src="resoucer/img/davivienda.png" alt="Servicio 3" />

        <h2>Davivienda</h2>
      </div>
